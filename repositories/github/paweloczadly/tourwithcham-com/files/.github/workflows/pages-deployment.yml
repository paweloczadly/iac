name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static assets
        run: |
          mkdir -p public/assets
          cp index.html public/index.html
          for asset in .site-assets/*.base64; do
            filename="$(basename "$asset" .base64)"
            base64 --decode "$asset" > "public/assets/$filename"
          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tourwithcham-com --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
